<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoScan AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #fff;
      padding: 18px;
      background:
        radial-gradient(circle at 10% 10%, rgba(37, 99, 235, .45), transparent 35%),
        radial-gradient(circle at 90% 20%, rgba(220, 38, 38, .35), transparent 32%),
        radial-gradient(circle at 50% 100%, rgba(34, 197, 94, .22), transparent 35%),
        #020617;
    }

    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(15, 23, 42, .92), rgba(2, 6, 23, .96));
      border: 1px solid rgba(148, 163, 184, .18);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 24px 70px rgba(0,0,0,.45);
      margin-bottom: 18px;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -60px;
      top: -60px;
      background: radial-gradient(circle, rgba(56, 189, 248, .35), transparent 65%);
    }

    .badge {
      display: inline-flex;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(37, 99, 235, .16);
      border: 1px solid rgba(96, 165, 250, .35);
      color: #bfdbfe;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: -.5px;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    .subtitle {
      color: #cbd5e1;
      margin-top: 10px;
      line-height: 1.5;
      font-size: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin: 18px 0;
    }

    .stat {
      background: rgba(15, 23, 42, .72);
      border: 1px solid rgba(148, 163, 184, .16);
      backdrop-filter: blur(14px);
      border-radius: 20px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: 0 14px 35px rgba(0,0,0,.28);
    }

    .num {
      font-size: 24px;
      font-weight: 900;
    }

    .label {
      color: #94a3b8;
      font-size: 12px;
      margin-top: 5px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .btn {
      border: 0;
      border-radius: 24px;
      padding: 20px 15px;
      color: white;
      font-size: 17px;
      font-weight: 900;
      text-align: left;
      min-height: 96px;
      box-shadow: 0 18px 45px rgba(0,0,0,.35);
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
    }

    .btn:active {
      transform: scale(.97);
      filter: brightness(1.12);
    }

    .blue { background: linear-gradient(135deg, #2563eb, #06b6d4); }
    .red { background: linear-gradient(135deg, #dc2626, #f97316); }
    .green { background: linear-gradient(135deg, #16a34a, #22c55e); }
    .purple { background: linear-gradient(135deg, #7c3aed, #db2777); }
    .dark { background: linear-gradient(135deg, #334155, #020617); }

    .wide {
      grid-column: span 2;
    }

    .form {
      display: grid;
      gap: 12px;
    }

    input {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, .22);
      background: rgba(15, 23, 42, .72);
      color: white;
      padding: 16px;
      border-radius: 18px;
      font-size: 16px;
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
    }

    input::placeholder {
      color: #64748b;
    }

    .result-card {
      background: rgba(15, 23, 42, .84);
      border: 1px solid rgba(148, 163, 184, .16);
      border-radius: 24px;
      padding: 18px;
      margin-top: 14px;
      box-shadow: 0 20px 55px rgba(0,0,0,.38);
    }

    .score {
      display: inline-block;
      padding: 7px 11px;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      border-radius: 999px;
      font-weight: 900;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .price {
      font-size: 24px;
      font-weight: 900;
      margin: 8px 0;
    }

    .muted {
      color: #94a3b8;
      line-height: 1.45;
    }

    .mini-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .mini {
      background: rgba(30, 41, 59, .78);
      border-radius: 16px;
      padding: 12px;
      color: #cbd5e1;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="hero">
    <div class="badge">AI DEAL SCOUT</div>
    <h1>🚗 AutoScan AI</h1>
    <div class="subtitle">
      Умный помощник для поиска выгодных авто: рынок, сигналы, фильтры и сделки в одном Telegram-приложении.
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="num">0</div>
      <div class="label">сигналов</div>
    </div>
    <div class="stat">
      <div class="num">0</div>
      <div class="label">ниже рынка</div>
    </div>
    <div class="stat">
      <div class="num">0</div>
      <div class="label">фильтров</div>
    </div>
  </div>

  <div class="grid">
    <button class="btn blue">🔥 Найти авто<br><span class="muted">по выгодности</span></button>
    <button class="btn red">🚨 Сигналы<br><span class="muted">новые сделки</span></button>
    <button class="btn green">🎯 Фильтры<br><span class="muted">мониторинг</span></button>
    <button class="btn purple">📈 Рынок<br><span class="muted">аналитика цен</span></button>
    <button class="btn dark wide">⭐ Избранное<br><span class="muted">сохранённые авто</span></button>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function goBack() {
      location.reload();
    }

    function showScreen(title, text) {
      document.body.innerHTML = `
        <div class="hero">
          <div class="badge">AUTOSCAN AI</div>
          <h1>${title}</h1>
          <div class="subtitle">${text}</div>
        </div>

        <div class="grid">
          <button class="btn dark wide" onclick="goBack()">⬅️ Назад</button>
        </div>
      `;
    }

    function searchCars() {
      const brand = document.getElementById("brand").value || "Toyota";
      const model = document.getElementById("model").value || "Camry";
      const city = document.getElementById("city").value || "Москва";
      const budget = document.getElementById("budget").value || "2000000";
      const year = document.getElementById("year").value || "2018";

      document.getElementById("results").innerHTML = `
        <div class="result-card">
          <div class="score">🟢 Deal Score 91</div>
          <h2>${brand} ${model} ${year}</h2>
          <div class="price">до ${Number(budget).toLocaleString("ru-RU")} ₽</div>
          <p class="muted">📍 ${city} · 📉 ниже рынка примерно на 14–18%</p>

          <div class="mini-row">
            <div class="mini">⚡ Потенциал<br><b>+120–180 тыс ₽</b></div>
            <div class="mini">⏱ Проверка<br><b>срочно</b></div>
          </div>

          <p class="muted">
            Данные пока тестовые. После подключения API здесь будут реальные объявления из базы.
          </p>
        </div>

        <div class="result-card">
          <div class="score">🟡 Deal Score 76</div>
          <h2>${brand} ${model}</h2>
          <div class="price">до ${Number(budget).toLocaleString("ru-RU")} ₽</div>
          <p class="muted">📊 Цена близка к рынку, стоит проверить историю и продавца.</p>
        </div>
      `;
    }

    document.querySelectorAll(".btn").forEach((button) => {
      button.addEventListener("click", () => {
        const text = button.innerText;

        if (text.includes("Найти авто")) {
          document.body.innerHTML = `
            <div class="hero">
              <div class="badge">SEARCH ENGINE</div>
              <h1>🔥 Найти авто</h1>
              <div class="subtitle">
                Введи параметры — AutoScan найдёт самые интересные варианты.
              </div>
            </div>

            <div class="form">
              <input id="brand" placeholder="Марка: Toyota" />
              <input id="model" placeholder="Модель: Camry" />
              <input id="year" placeholder="Год от: 2018" />
              <input id="city" placeholder="Город: Москва" />
              <input id="budget" placeholder="Бюджет до: 2000000" />

              <button class="btn blue wide" onclick="searchCars()">🔎 Найти выгодные авто</button>
              <button class="btn dark wide" onclick="goBack()">⬅️ Назад</button>
            </div>

            <div id="results"></div>
          `;
        }

        if (text.includes("Сигналы")) {
          showScreen(
            "🚨 Сигналы",
            "Здесь будут свежие объявления ниже рынка, срочные продажи и топ-сделки дня."
          );
        }

        if (text.includes("Фильтры")) {
          showScreen(
            "🎯 Фильтры",
            "Здесь пользователь сможет создавать фильтры поиска и получать уведомления."
          );
        }

        if (text.includes("Рынок")) {
          showScreen(
            "📈 Рынок",
            "Здесь будет аналитика: средняя цена, минимум, максимум и динамика по модели."
          );
        }

        if (text.includes("Избранное")) {
          showScreen(
            "⭐ Избранное",
            "Здесь будут сохранённые автомобили пользователя."
          );
        }
      });
    });
  </script>
</body>
</html>
