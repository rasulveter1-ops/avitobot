```html
<section class="cars-section">

  <div class="section-title">
    🔥 Реальные объявления AutoScan
  </div>

  <div id="cars">

    <div class="loading-wrap">
      <div class="loader"></div>
      <div class="loading-text">
        Ищем выгодные автомобили...
      </div>
    </div>

  </div>

</section>

<style>

.cars-section{
  margin-top:22px;
  padding-bottom:120px;
}

.section-title{
  font-size:24px;
  font-weight:900;
  color:#0f172a;
  margin-bottom:16px;
  letter-spacing:-0.5px;
}

.loading-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 0;
}

.loader{
  width:46px;
  height:46px;
  border:4px solid #dbeafe;
  border-top:4px solid #22c55e;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

.loading-text{
  margin-top:14px;
  color:#64748b;
  font-size:15px;
  font-weight:600;
}

@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}

.car-card{
  background:#ffffff;
  border-radius:26px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:
    0 10px 40px rgba(15,23,42,.06),
    0 2px 10px rgba(15,23,42,.03);

  border:1px solid #e2e8f0;
}

.car-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.car-title{
  font-size:18px;
  line-height:1.35;
  font-weight:900;
  color:#0f172a;
  flex:1;
}

.deal-score{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  padding:7px 12px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
  box-shadow:0 4px 14px rgba(34,197,94,.25);
}

.car-price{
  font-size:32px;
  font-weight:900;
  color:#16a34a;
  margin-top:18px;
  letter-spacing:-1px;
}

.car-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:18px;
}

.car-info{
  background:#f8fafc;
  border-radius:16px;
  padding:12px;
}

.car-label{
  font-size:11px;
  color:#94a3b8;
  font-weight:700;
  margin-bottom:4px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.car-value{
  font-size:14px;
  font-weight:800;
  color:#0f172a;
}

.car-actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.fav-btn{
  width:54px;
  height:54px;
  border:none;
  border-radius:16px;
  background:#f1f5f9;
  font-size:20px;
}

.open-btn{
  flex:1;
  height:54px;
  border:none;
  border-radius:16px;
  background:linear-gradient(135deg,#16a34a,#22c55e);
  color:white;
  font-size:15px;
  font-weight:900;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 20px rgba(34,197,94,.25);
}

.open-btn:active{
  transform:scale(.98);
}

.error-box{
  background:#ffffff;
  border-radius:24px;
  padding:24px;
  text-align:center;
  border:1px solid #fee2e2;
}

.error-title{
  font-size:20px;
  font-weight:900;
  color:#dc2626;
  margin-bottom:8px;
}

.error-sub{
  color:#64748b;
  font-size:14px;
  line-height:1.5;
}

</style>

<script>

async function loadCars(){

  const container = document.getElementById("cars");

  container.innerHTML = `
    <div class="loading-wrap">
      <div class="loader"></div>
      <div class="loading-text">
        Ищем выгодные автомобили...
      </div>
    </div>
  `;

  try{

    const response = await fetch(
      "/api/search?brand=toyota&budget=2500000"
    );

    const data = await response.json();

    container.innerHTML = "";

    if(!data.cars || !data.cars.length){

      container.innerHTML = `
        <div class="error-box">
          <div class="error-title">
            Ничего не найдено
          </div>

          <div class="error-sub">
            В базе пока нет подходящих автомобилей.
          </div>
        </div>
      `;

      return;
    }

    data.cars.forEach(car => {

      const score = Math.floor(Math.random() * 12) + 88;

      const card = document.createElement("div");

      card.className = "car-card";

      card.innerHTML = `

        <div class="car-top">

          <div class="car-title">
            ${car.title || "Без названия"}
          </div>

          <div class="deal-score">
            AI ${score}
          </div>

        </div>

        <div class="car-price">
          ${Number(car.price || 0).toLocaleString("ru-RU")} ₽
        </div>

        <div class="car-grid">

          <div class="car-info">
            <div class="car-label">
              Город
            </div>

            <div class="car-value">
              ${car.city || "-"}
            </div>
          </div>

          <div class="car-info">
            <div class="car-label">
              Год
            </div>

            <div class="car-value">
              ${car.year || "-"}
            </div>
          </div>

          <div class="car-info">
            <div class="car-label">
              Пробег
            </div>

            <div class="car-value">
              ${(car.mileage || 0).toLocaleString("ru-RU")} км
            </div>
          </div>

          <div class="car-info">
            <div class="car-label">
              Статус
            </div>

            <div class="car-value">
              Ниже рынка
            </div>
          </div>

        </div>

        <div class="car-actions">

          <button class="fav-btn">
            ⭐
          </button>

          <a
            href="${car.url}"
            target="_blank"
            class="open-btn"
          >
            Открыть Авито
          </a>

        </div>
      `;

      container.appendChild(card);

    });

  }catch(e){

    console.log(e);

    container.innerHTML = `
      <div class="error-box">

        <div class="error-title">
          Ошибка API
        </div>

        <div class="error-sub">
          Сервер не ответил или база ещё загружается.
        </div>

      </div>
    `;
  }
}

loadCars();

</script>
```
