<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>AutoScan AI</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#eef2f5;
  font-family:Inter,Arial,sans-serif;
  color:#0f172a;
  padding:20px;
  -webkit-font-smoothing:antialiased;
}

.section-title{
  font-size:26px;
  font-weight:900;
  margin-bottom:18px;
  letter-spacing:-0.5px;
}

.loading-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 0;
}

.loader{
  width:48px;
  height:48px;
  border:4px solid #dbeafe;
  border-top:4px solid #22c55e;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

.loading-text{
  margin-top:14px;
  color:#64748b;
  font-size:15px;
  font-weight:700;
}

@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}

.car-card{
  background:#fff;
  border-radius:28px;
  overflow:hidden;
  margin-bottom:22px;
  border:1px solid #e2e8f0;

  box-shadow:
    0 10px 30px rgba(15,23,42,.05),
    0 2px 10px rgba(15,23,42,.03);
}

.car-image-wrap{
  width:100%;
  height:240px;
  background:#e2e8f0;
  overflow:hidden;
}

.car-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.car-content{
  padding:22px;
}

.car-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.car-title{
  font-size:19px;
  line-height:1.35;
  font-weight:900;
  flex:1;
}

.deal-score{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  padding:8px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
}

.car-price{
  font-size:34px;
  font-weight:900;
  color:#16a34a;
  margin-top:18px;
  letter-spacing:-1px;
}

.market-badge{
  display:inline-flex;
  margin-top:12px;
  padding:8px 14px;
  border-radius:999px;
  background:#dcfce7;
  color:#15803d;
  font-size:13px;
  font-weight:900;
}

.profit-box{
  margin-top:14px;
  padding:16px;
  border-radius:20px;
  background:linear-gradient(135deg,#f0fdf4,#ffffff);
  border:1px solid #bbf7d0;
}

.profit-label{
  font-size:13px;
  color:#166534;
  font-weight:700;
}

.profit-value{
  margin-top:6px;
  font-size:28px;
  color:#16a34a;
  font-weight:900;
}

.car-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:18px;
}

.car-info{
  background:#f8fafc;
  border-radius:18px;
  padding:14px;
}

.car-label{
  font-size:11px;
  color:#94a3b8;
  font-weight:800;
  margin-bottom:6px;
  text-transform:uppercase;
}

.car-value{
  font-size:14px;
  font-weight:800;
  line-height:1.4;
}

.car-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.fav-btn{
  width:56px;
  height:56px;
  border:none;
  border-radius:18px;
  background:#f1f5f9;
  font-size:20px;
}

.open-btn{
  flex:1;
  height:56px;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,#16a34a,#22c55e);
  color:white;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:900;
}

.error-box{
  background:#fff;
  border-radius:24px;
  padding:24px;
  text-align:center;
}

.error-title{
  font-size:20px;
  font-weight:900;
  color:#dc2626;
}

.error-sub{
  margin-top:10px;
  color:#64748b;
  line-height:1.5;
}

</style>

</head>

<body>

<div class="section-title">
  🔥 AutoScan AI — выгодные авто
</div>

<div id="cars">

  <div class="loading-wrap">

    <div class="loader"></div>

    <div class="loading-text">
      Анализируем рынок автомобилей...
    </div>

  </div>

</div>

<script>

async function loadCars(){

  const container = document.getElementById("cars");

  try{

    const response = await fetch(
      "/api/search?brand=toyota&budget=2500000&only_deals=1"
    );

    const data = await response.json();

    container.innerHTML = "";

    if(!data.cars || !data.cars.length){

      container.innerHTML = `
        <div class="error-box">

          <div class="error-title">
            Ничего не найдено
          </div>

          <div class="error-sub">
            Пока нет выгодных автомобилей.
          </div>

        </div>
      `;

      return;
    }

    data.cars.forEach(car => {

      const price =
        Number(car.price || 0)
        .toLocaleString("ru-RU");

      const avgRf =
        Number(car.avg_price_rf || 0)
        .toLocaleString("ru-RU");

      const avgRegion =
        Number(car.avg_price_region || 0)
        .toLocaleString("ru-RU");

      const minRf =
        Number(car.min_price_rf || 0)
        .toLocaleString("ru-RU");

      const maxRf =
        Number(car.max_price_rf || 0)
        .toLocaleString("ru-RU");

      const mileage =
        Number(car.mileage || 0)
        .toLocaleString("ru-RU");

      const below =
        car.below_market_percent || 0;

      const potential =
        Number(car.resale_potential || 0)
        .toLocaleString("ru-RU");

      const score =
        car.deal_score || 0;

      const card = document.createElement("div");

      card.className = "car-card";

      card.innerHTML = `

        ${car.image_url ? `

        <div class="car-image-wrap">

          <img
            src="${car.image_url}"
            class="car-image"
            loading="lazy"
          >

        </div>

        ` : ``}

        <div class="car-content">

          <div class="car-top">

            <div class="car-title">
              ${car.title || "Без названия"}
            </div>

            <div class="deal-score">
              AI ${score}
            </div>

          </div>

          <div class="car-price">
            ${price} ₽
          </div>

          <div class="market-badge">
            📉 Ниже рынка на ${below}%
          </div>

          <div class="profit-box">

            <div class="profit-label">
              Потенциал перепродажи
            </div>

            <div class="profit-value">
              +${potential} ₽
            </div>

          </div>

          <div class="car-grid">

            <div class="car-info">

              <div class="car-label">
                Средняя РФ
              </div>

              <div class="car-value">
                ${avgRf} ₽
              </div>

            </div>

            <div class="car-info">

              <div class="car-label">
                Средняя регион
              </div>

              <div class="car-value">
                ${avgRegion} ₽
              </div>

            </div>

            <div class="car-info">

              <div class="car-label">
                Мин РФ
              </div>

              <div class="car-value">
                ${minRf} ₽
              </div>

            </div>

            <div class="car-info">

              <div class="car-label">
                Макс РФ
              </div>

              <div class="car-value">
                ${maxRf} ₽
              </div>

            </div>

            <div class="car-info">

              <div class="car-label">
                Город
              </div>

              <div class="car-value">
                ${car.city || "-"}
              </div>

            </div>

            <div class="car-info">

              <div class="car-label">
                Год / пробег
              </div>

              <div class="car-value">
                ${car.year || "-"} · ${mileage} км
              </div>

            </div>

          </div>

          <div class="car-actions">

            <button class="fav-btn">
              ⭐
            </button>

            <a
              href="${car.url}"
              target="_blank"
              class="open-btn"
            >
              Открыть Авито
            </a>

          </div>

        </div>

      `;

      container.appendChild(card);

    });

  }catch(e){

    console.log(e);

    container.innerHTML = `

      <div class="error-box">

        <div class="error-title">
          Ошибка API
        </div>

        <div class="error-sub">
          Сервер не ответил или база ещё загружается.
        </div>

      </div>

    `;
  }
}

loadCars();

</script>

</body>
</html>
