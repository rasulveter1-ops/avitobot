<script>
async function loadCars() {

  const container = document.getElementById("cars");

  container.innerHTML = `
    <div class="loading">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;

  try {

    const response = await fetch(
      "/api/search?brand=toyota&budget=2000000"
    );

    const data = await response.json();

    container.innerHTML = "";

    if (!data.cars || !data.cars.length) {

      container.innerHTML = `
        <div class="car-card">
          <div class="car-title">
            Пока нет объявлений
          </div>
        </div>
      `;

      return;
    }

    data.cars.forEach(car => {

      const score = Math.floor(Math.random() * 12) + 88;

      const card = document.createElement("div");

      card.className = "car-card";

      card.innerHTML = `
        <div class="car-top">

          <div class="car-title">
            ${car.title || "Без названия"}
          </div>

          <div class="deal-score">
            AI ${score}
          </div>

        </div>

        <div class="car-price">
          ${Number(car.price || 0).toLocaleString("ru-RU")} ₽
        </div>

        <div class="car-grid">

          <div class="car-info">
            <div class="car-label">Город</div>
            <div class="car-value">
              ${car.city || "-"}
            </div>
          </div>

          <div class="car-info">
            <div class="car-label">Год</div>
            <div class="car-value">
              ${car.year || "-"}
            </div>
          </div>

          <div class="car-info">
            <div class="car-label">Пробег</div>
            <div class="car-value">
              ${(car.mileage || 0).toLocaleString("ru-RU")} км
            </div>
          </div>

          <div class="car-info">
            <div class="car-label">Статус</div>
            <div class="car-value">
              Ниже рынка
            </div>
          </div>

        </div>

        <div class="car-actions">

          <button class="fav-btn">
            ⭐
          </button>

          <a
            href="${car.url}"
            target="_blank"
            class="open-btn"
          >
            Открыть Авито
          </a>

        </div>
      `;

      container.appendChild(card);

    });

  } catch (e) {

    console.log(e);

    container.innerHTML = `
      <div class="car-card">
        <div class="car-title">
          Ошибка загрузки API
        </div>
      </div>
    `;
  }
}

loadCars();
</script>
